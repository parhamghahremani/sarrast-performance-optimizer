<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Sarrast - Reader</title>
    <style>
        body { min-height: 100vh; }
        .col { min-height: 100vh; }
        .pg { width: 100%; height: auto; min-height: 3000px; background: #ccc; }
        .boxes { position: relative; min-height: 100vh; }
        .bx { position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body class="rdr">
    <div class="col">
        <img class="pg" src="image1.jpg" alt="Page 1" style="height: 3000px;">
        <img class="pg" src="image2.jpg" alt="Page 2" style="height: 3000px;">
        <img class="pg" src="image3.jpg" alt="Page 3" style="height: 3000px;">
    </div>
    <div class="boxes">
        <div class="bx" style="--x:0; --ex:200; --y:0; --ey:100;">Translation 1</div>
        <div class="bx" style="--x:0; --ex:200; --y:0; --ey:100;">Translation 2</div>
        <div class="bx" style="--x:0; --ex:200; --y:0; --ey:100;">Translation 3</div>
        <div class="bx" style="--x:0; --ex:200; --y:0; --ey:100;">Translation 4</div>
        <div class="bx" style="--x:0; --ex:200; --y:0; --ey:100;">Translation 5</div>
    </div>
</body>
</html>
